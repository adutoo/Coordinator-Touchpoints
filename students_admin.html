<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coordinator Touchpoints — Students Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* make table take full space */
    .sm-tablewrap { width: 100%; overflow: auto; }
    .sm-table { width: 100%; min-width: max-content; border-collapse: separate; border-spacing: 0; }

    /* header layout: label + delete icon */
    .sm-th {
      position: relative;
      white-space: nowrap;
    }
    .sm-th-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    .sm-col-del {
      opacity: 0;
      pointer-events: none;
      transform: translateY(1px);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }
    th.sm-th:hover .sm-col-del {
      opacity: 1;
      pointer-events: auto;
    }
    .sm-col-del:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* action header: right-end "+" */
    .sm-addcol-btn {
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 18px;
      line-height: 1;
    }
    .sm-addcol-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.10);
    }

    /* row delete icon button */
    .sm-icon-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sm-icon-btn:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* top toolbar */
    .sm-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 10px 0 12px;
    }
    .sm-toolbar .left, .sm-toolbar .right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sm-search {
      min-width: 260px;
      width: min(420px, 100%);
    }

    /* modal */
    .sm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .sm-modal.open { display: flex; }
    .sm-modal-card {
      width: min(720px, 96vw);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .sm-modal-head {
      padding: 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
    }
    .sm-modal-body { padding: 14px; }
    .sm-modal-head h3 { margin: 0; font-size: 14px; color: var(--text); }
    .sm-close {
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
    }
    .sm-close:hover { border-color: var(--accent); }

    /* Inputs in student admin table */
    .sm-cell,
    .sm-search {
      width: 100%;
      box-sizing: border-box;
      height: 34px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      font-size: 12px;
      line-height: 1.2;
      outline: none;
      box-shadow: none;
      transition: border-color .15s ease, box-shadow .15s ease;
      font-family: inherit;
    }

    .sm-cell:hover,
    .sm-search:hover {
      border-color: #c5cdd8;
    }

    .sm-cell:focus,
    .sm-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    .sm-cell::placeholder,
    .sm-search::placeholder {
      color: var(--muted);
    }

    td .sm-cell {
      background: var(--white);
    }

    .sm-cell[readonly],
    .sm-cell:disabled {
      opacity: 0.70;
      cursor: not-allowed;
      background: var(--bg1);
    }

    @media (max-width: 768px){
      .sm-toolbar{
        flex-direction: column;
        align-items: stretch;
      }
      .sm-toolbar .left,
      .sm-toolbar .right{
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }
      .sm-toolbar .left .btn,
      .sm-toolbar .right .btn{
        width: 100%;
        text-align: center;
        padding: 11px 14px;
        font-size: 14px;
      }
      .sm-search{
        min-width: 100% !important;
        width: 100% !important;
        height: 42px;
        font-size: 14px;
      }
      .sm-modal-card{
        width: min(720px, 100vw - 16px);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="navHolder"></div>

    <div class="grid">
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <h2 style="margin:0;">Students Database (Admin)</h2>
            <p class="muted" style="margin-top:6px;">Spreadsheet-like editor. Changes reflect everywhere because data is read from this table.</p>
          </div>
          <div class="pill" id="smDirtyPill" style="display:none;">Unsaved changes</div>
        </div>

        <div class="sm-toolbar">
          <div class="left">
            <input id="smSearch" class="sm-search" type="text" placeholder="Search (name/class/section/sr number)..." />
          </div>
          <div class="right">
            <button id="smReload" class="btn" type="button">Refresh</button>
            <button id="smAddRow" class="btn" type="button">+ Row</button>
            <button id="smSave" class="btn primary" type="button">Save</button>

            <!-- ✅ Upload button at top of table -->
            <button id="smUploadOpen" class="btn" type="button">Upload</button>

            <button id="smExport" class="btn" type="button">Export XLSX</button>
          </div>
        </div>

        <div id="smMsg" class="notice" style="display:none;"></div>

        <div class="row" style="justify-content:space-between; margin-top:10px;">
          <div id="smMetaTop" class="muted"></div>
          <div class="row" style="gap:10px;">
            <button id="smPrev" class="btn" type="button">Prev</button>
            <div id="smPage" class="muted"></div>
            <button id="smNext" class="btn" type="button">Next</button>
          </div>
        </div>
        <div id="smMeta" class="muted" style="margin-top:6px;"></div>

        <div class="sm-tablewrap" style="margin-top:10px;">
          <table class="sm-table">
            <thead id="smThead"></thead>
            <tbody id="smTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Import Modal -->
  <div id="smImportModal" class="sm-modal" aria-hidden="true">
    <div class="sm-modal-card">
      <div class="sm-modal-head">
        <h3>Import Students (CSV/XLSX)</h3>
        <button id="smImportClose" class="sm-close" type="button">Close</button>
      </div>
      <div class="sm-modal-body">
        <div class="form">
          <div class="field span12">
            <label>File</label>
            <input id="smFile" type="file" accept=".csv,.xlsx" />
          </div>

          <div class="field span6">
            <label>Import Mode</label>
            <select id="smImportMode">
              <option value="upsert" selected>Upsert (recommended)</option>
              <option value="insert">Insert only</option>
            </select>
          </div>

          <div class="field span6">
            <label>Upsert Key (for Upsert mode)</label>
            <select id="smUpsertKey"></select>
          </div>

          <div class="field span12">
            <div class="row" style="justify-content:flex-end; gap:10px;">
              <button id="smImport" class="btn primary" type="button">Import</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Add Column Modal -->
  <div id="smColModal" class="sm-modal" aria-hidden="true">
    <div class="sm-modal-card">
      <div class="sm-modal-head">
        <h3>Add Column</h3>
        <button id="smColClose" class="sm-close" type="button">Close</button>
      </div>
      <div class="sm-modal-body">
        <div class="form">
          <div class="field span6">
            <label>Column Name</label>
            <input id="smAddColName" type="text" placeholder="e.g. father_name" />
          </div>
          <div class="field span6">
            <label>Type</label>
            <select id="smAddColType">
              <option value="text" selected>text</option>
              <option value="integer">integer</option>
              <option value="bigint">bigint</option>
              <option value="numeric">numeric</option>
              <option value="boolean">boolean</option>
              <option value="date">date</option>
              <option value="timestamp with time zone">timestamptz</option>
              <option value="jsonb">jsonb</option>
              <option value="uuid">uuid</option>
              <option value="varchar(50)">varchar(50)</option>
              <option value="varchar(100)">varchar(100)</option>
            </select>
          </div>

          <div class="field span12">
            <div class="row" style="justify-content:flex-end; gap:10px;">
              <button id="smAddColBtn" class="btn primary" type="button">Add Column</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/studentsAdmin.js"></script>
</body>
</html>
